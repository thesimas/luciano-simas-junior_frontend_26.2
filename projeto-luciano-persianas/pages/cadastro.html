<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luciano Persianas - Cadastro</title>
    <link rel="shortcut icon" href="../assets/images/logoFavIcon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsivo.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="../assets/images/logo.png" alt="Logo empresa Luciano Persianas" class="logo-navbar">
            <h1 hidden>Página de Cadastro</h1>
            <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir ou fechar o menu de navegação">
            <label for="menu-toggle" class="menu-hamburguer" aria-hidden="true">
            <span></span>
            </label>
            <ul class="nav-links">
                <li><a href="../../index.html">Inicio</a></li>
                <li><a href="../pages/login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    <main>
    <section>
        <h2 hidden>Seção de Cadastro</h2>
        <article>
            <h2 hidden>Artigo de Cadastro</h2>
            <form action="#" method="post" class="cadastro">
                <fieldset>
                        <legend>Formulário de Cadastro</legend>
                        <label for="nome">Nome:</label>
                        <input type="text" name="nome" id="nome" required placeholder="">
                        <label for="email">Email: </label>
                        <input type="email" name="email" id="email" placeholder="usuario@email.com" required>
                        <label for="cpf">CPF:</label>
                        <input type="text" name="cpf" id="cpf" required minlength="11" maxlength="11" placeholder="Digite seu CPF sem pontuação">
                        <label for="senha">Senha:</label>
                        <input type="password" name="senha" id="senha" required placeholder="*******">
                        <label for="confirmar-senha">Confirmar senha:</label>
                        <input type="password" name="confirmar-senha" id="confirmar-senha" required placeholder="*******">
                        <br>
                        <button type="submit">Cadastrar</button>
                    </fieldset>
                    <div class="cadastro-logar">
                        <p>Já possui cadastro?</p>
                        <a href="../pages/login.html">Logar</a>
                    </div>
            </form>
        </article>
    </section>
    </main>
    <footer>
        <p>&copy; 2026 - Loja Virtual Luciano Persianas - Todos os direitos reservados.</p>
        <p>Desenvolvido por <a href="https://github.com/thesimas" target="_blank">Luciano Simas Junior</a></p>
    </footer>
</body>
</html>
